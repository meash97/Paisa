<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#131417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Paisa — Money Manager</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234d87f5'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#131417;--card:#1d1e22;--card2:#27282d;--card3:#33343a;--line:#2b2c32;--text:#ececef;--muted:#9a9ca4;--dim:#6b6d75;--green:#34c77b;--red:#ec5f4f;--blue:#4d87f5;--orange:#ff8a1f;--fs:1}
html.black{--bg:#000;--card:#141416;--card2:#202024;--card3:#2c2c31;--line:#242428}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",system-ui,-apple-system,sans-serif;font-size:calc(14px*var(--fs));min-height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:contain}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:calc(14px*var(--fs))}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
#screen{padding:4px 14px 120px}
.title{font-size:calc(26px*var(--fs));font-weight:400;margin:8px 0 8px;display:flex;align-items:center}
.title span{flex:1}
.card{background:var(--card);border-radius:20px;padding:14px 16px 14px;margin-bottom:10px}
.card h2{font-size:calc(18px*var(--fs));font-weight:600;margin:0}
.chead{display:flex;align-items:center;margin-bottom:10px}
.chead .t{flex:1}
.sub{color:var(--muted);font-size:calc(13px*var(--fs))}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-size:calc(14px*var(--fs));padding:10px 4px;border-radius:999px;white-space:nowrap}
.seg button.on{background:#3b3c43;color:var(--text);font-weight:600}
.seg.sm button{padding:9px 4px;font-size:calc(13px*var(--fs))}
.ico{width:24px;height:24px;display:inline-block;vertical-align:middle;flex:none}
.tile{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;position:relative;flex:none}
.tile .ico{width:23px;height:23px}
.tile.sm{width:36px;height:36px;border-radius:10px}.tile.sm .ico{width:20px;height:20px}
.tile.xs{width:24px;height:24px;border-radius:7px}.tile.xs .ico{width:14px;height:14px}
.tile.lg{width:52px;height:52px;border-radius:15px}.tile.lg .ico{width:28px;height:28px}
.tile.round{border-radius:50%!important}
.badge{position:absolute;right:-6px;bottom:-6px;width:21px;height:21px;border-radius:50%;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;background:var(--blue)}
.badge .ico{width:11px;height:11px}
.ibtn{background:none;border:0;color:var(--text);padding:8px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.ibtn .ico{width:24px;height:24px}
.ibtn.muted{color:var(--muted)}
.pos{color:var(--green)}.neg{color:var(--red)}.mut{color:var(--muted)}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{text-align:right}
.big{font-size:calc(33px*var(--fs));font-weight:400;letter-spacing:-.5px}
.link{color:var(--blue)}
.center{text-align:center}
.hr{height:1px;background:var(--line);margin:10px 0}
/* bottom nav */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#1a1b1f;display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:20}
.bnav button{flex:1;background:none;border:0;color:var(--muted);font-size:calc(12px*var(--fs));display:flex;flex-direction:column;align-items:center;gap:5px;padding:0}
.bnav .pill{padding:5px 20px;border-radius:999px;display:flex}
.bnav .pill .ico{width:26px;height:26px}
.bnav button.on{color:var(--text)}.bnav button.on .pill{background:#33343a}
.fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:96px;width:60px;height:60px;border-radius:18px;background:var(--blue);border:0;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.45);z-index:21}
.fab .ico{width:30px;height:30px}
/* sheets */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;max-width:520px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom));animation:up .22s ease;display:flex;flex-direction:column}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.hdr{display:flex;align-items:center;gap:6px;padding:12px 0 8px;position:sticky;top:0;background:var(--bg);z-index:3}
.hdr h1{font-size:calc(24px*var(--fs));font-weight:400;margin:0;flex:1}
.hdr h1.c{text-align:center}
.sheet.tx{padding-bottom:0;top:auto;bottom:0;max-height:100%;border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.sheet.tx .hdr{padding-top:10px}
.txbody{flex:0 1 auto;overflow:auto;padding-bottom:4px}
.txscrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:49;max-width:520px;margin:0 auto}
/* lists */
.li{display:flex;align-items:center;gap:14px;padding:9px 4px}
.li .nm{font-size:calc(17px*var(--fs))}
.li .sb{color:var(--muted);font-size:calc(13px*var(--fs));margin-top:2px}
.li.tap{cursor:pointer}
.cb{width:26px;height:26px;border:2px solid #4a4b52;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center}
.cb.on{background:var(--blue);border-color:var(--blue)}
.cb .ico{width:18px;height:18px;color:#fff}
/* accounts grid */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px}
.aitem{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer}
.aitem .tile{width:36px;height:36px;border-radius:10px}.aitem .tile .ico{width:20px;height:20px}.aitem .badge{width:17px;height:17px;right:-4px;bottom:-4px}.aitem .badge .ico{width:9px;height:9px}
.aitem .n{font-size:calc(15px*var(--fs));line-height:1.2}
.aitem .b{font-size:calc(15px*var(--fs));color:#d8d9dd;line-height:1.2}
/* account groups */
.grp{background:var(--card2);border-radius:16px;padding:10px 12px 12px;margin-top:10px}
.grp:first-of-type{margin-top:2px}
.grph{padding:0 2px 10px;font-size:calc(13px*var(--fs));color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.grph .neg{color:var(--red)}
.arow{display:flex;align-items:center;gap:12px;padding:7px 0;cursor:pointer}
.arow .tile{width:38px;height:38px;border-radius:11px}.arow .tile .ico{width:21px;height:21px}.arow .badge{width:17px;height:17px;right:-4px;bottom:-4px;border-color:var(--card2)}.arow .badge .ico{width:9px;height:9px}
.arow .n{font-size:calc(16px*var(--fs))}.arow .b{font-size:calc(16px*var(--fs));color:#e4e5e9;white-space:nowrap;margin-left:8px}
.arow .bar{height:6px;background:#3a3b42;border-radius:4px;margin-top:6px;overflow:hidden}
.arow .bar i{display:block;height:100%;border-radius:4px;min-width:2px}
/* chips */
.chips{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:16px;padding:10px 14px 10px 10px;border:0;color:var(--text);text-align:left}
.chip .n{font-size:calc(15px*var(--fs));font-weight:500}.chip .b{font-size:calc(12px*var(--fs));color:var(--muted)}
.chip.on .b{color:rgba(255,255,255,.9)}
.cchip{flex:none;display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:999px;padding:7px 18px 7px 8px;border:2px solid transparent;color:var(--text);font-size:calc(17px*var(--fs))}
.cchip .tile{width:34px;height:34px;border-radius:50%}.cchip .tile .ico{width:18px;height:18px}
.cchip.on{border-color:currentColor}
/* buttons */
.btn{background:var(--blue);color:#fff;border:0;border-radius:999px;padding:16px 28px;font-size:calc(17px*var(--fs));font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.w{width:100%}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.sm{padding:9px 16px;font-size:calc(13px*var(--fs))}
.btn.danger{background:#3a2426;color:#ff8a80}
.btnrow{position:sticky;bottom:0;padding:12px 0 6px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;justify-content:flex-end;gap:10px}
/* inputs */
.field{background:var(--card2);border-radius:18px;padding:14px 18px;display:flex;align-items:center;gap:10px;margin:8px 0}
.field input,.field select{flex:1;background:none;border:0;color:var(--text);font-size:calc(17px*var(--fs));outline:0;min-width:0;width:100%}
.field select option{background:#222}
.lbl{color:var(--muted);font-size:calc(12px*var(--fs));margin:14px 4px 2px}
.tag{background:#1e3a2a;color:var(--green);border-radius:12px;padding:8px 14px;font-weight:600;font-size:calc(14px*var(--fs))}
.info{background:#182a20;border-radius:18px;padding:16px 18px;display:flex;justify-content:space-between;font-size:calc(17px*var(--fs));margin:8px 0}
.info.red{background:#2f1e1e}
.info.blue{background:#1b2740}
/* keypad */
.keypad{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:60px;background:#17181c;margin:0 -14px;padding:6px 10px calc(10px + env(safe-area-inset-bottom))}
.keypad button{background:none;border:0;color:var(--text);font-size:calc(30px*var(--fs));font-weight:300;border-radius:16px}
.keypad button:active{background:#2a2b31}
.keypad button.op{font-size:calc(26px*var(--fs));color:#d8d9dd}
.keypad button.ok{grid-row:3/5;grid-column:5}
.keypad button .ico{width:30px;height:30px}
.amt{font-size:calc(47px*var(--fs));text-align:center;padding:10px 0 8px;font-weight:300;letter-spacing:-1px;word-break:break-all}
.amt.dim{color:#8f9097}
.amtline{height:1px;background:#3a3b42;margin:0 60px 14px}
.note{display:block;width:100%;background:none;border:0;color:var(--text);text-align:center;font-size:calc(17px*var(--fs));outline:0;padding:4px 0 14px}
.note::placeholder{color:var(--muted)}
/* month nav */
.mnav{display:flex;align-items:center;padding:4px 2px 8px}
.mnav .m{flex:1;font-size:calc(17px*var(--fs));font-weight:600;display:flex;align-items:center;gap:14px}
/* tx list */
.day{display:flex;align-items:center;gap:14px;padding:16px 4px 6px}
.day .dn{font-size:calc(24px*var(--fs));font-weight:500;width:42px}
.day .dw{font-size:calc(17px*var(--fs));line-height:1.2}
.day .dm{color:var(--muted);font-size:calc(13px*var(--fs))}
.trow{display:flex;align-items:center;gap:14px;padding:10px 4px;cursor:pointer}
.trow .t1{font-size:calc(17px*var(--fs))}
.trow .t2{font-size:calc(13px*var(--fs));font-weight:600;display:flex;align-items:center;gap:5px;margin-top:2px}
.trow .t2 .ico{width:14px;height:14px}
.trow .t3{color:var(--muted);font-size:calc(13px*var(--fs));margin-top:2px}
.trow .am{font-size:calc(17px*var(--fs));text-align:right}
.trow .tm{color:var(--muted);font-size:calc(12px*var(--fs));text-align:right;margin-top:3px}
.tots{display:flex;justify-content:space-between;padding:4px 6px 6px;font-size:calc(14px*var(--fs))}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:20px;padding:10px 16px;margin:6px 0 12px}
.search input{flex:1;background:none;border:0;color:var(--text);font-size:calc(17px*var(--fs));outline:0;min-width:0}
/* category list */
.crow{display:flex;align-items:center;gap:14px;padding:10px 4px;cursor:pointer}
.crow .bar{height:10px;background:#2c2d33;border-radius:6px;margin-top:8px;overflow:hidden;flex:1}
.crow .bar i{display:block;height:100%;border-radius:6px}
.crow .nm{font-size:calc(18px*var(--fs))}
.crow .am{font-size:calc(18px*var(--fs));text-align:right}
.crow .pc{color:var(--muted);font-size:calc(13px*var(--fs));text-align:right;margin-top:4px}
/* budget */
.brow{display:flex;align-items:center;gap:14px;padding:10px 4px;cursor:pointer}
.ring{position:relative;width:56px;height:56px;flex:none;text-align:center}
.ring svg{position:absolute;inset:0}
.ring .tile{position:absolute;left:2px;top:2px}
.ring .p{position:absolute;top:58px;left:0;right:0;font-size:calc(13px*var(--fs));color:var(--muted)}
/* menu */
.menu{position:fixed;z-index:60;background:#26272c;border-radius:22px;padding:8px;min-width:230px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;color:var(--text);font-size:calc(17px*var(--fs));padding:16px 22px;border-radius:14px;text-align:left}
.menu button.on{background:#3b3c43}
.menu button .ico{width:22px;height:22px}
.scrim{position:fixed;inset:0;z-index:59}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#2f3036;color:#fff;padding:12px 20px;border-radius:14px;z-index:99;font-size:calc(13px*var(--fs));box-shadow:0 6px 20px rgba(0,0,0,.4);animation:up .2s ease}
/* pickers */
.colors{display:flex;flex-wrap:wrap;gap:12px;padding:6px 2px}
.colors span{width:38px;height:38px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.colors span.on{border-color:#fff}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:6px 0}
.icons button{background:var(--card2);border:2px solid transparent;border-radius:14px;height:52px;color:var(--text);display:flex;align-items:center;justify-content:center}
.icons button.on{border-color:#fff}
.icons button .ico{width:24px;height:24px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:4px 0 12px}
.cal .h{text-align:center;color:var(--muted);font-size:calc(12px*var(--fs));padding:4px 0}
.cal .d{background:var(--card);border-radius:10px;min-height:52px;padding:5px 4px;font-size:calc(13px*var(--fs));cursor:pointer}
.cal .d.on{outline:2px solid var(--blue)}
.cal .d .v{font-size:calc(11px*var(--fs));margin-top:3px;word-break:break-all}
.cal .d.off{opacity:.35}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:calc(14px*var(--fs))}
.small{font-size:calc(13px*var(--fs));color:var(--muted)}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:calc(16px*var(--fs))}
.kv .k{color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.sec{font-size:calc(15px*var(--fs));font-weight:600;color:var(--muted);margin:16px 4px 4px;text-transform:uppercase;letter-spacing:.5px;font-size:calc(13px*var(--fs))}
.hint{color:var(--muted);font-size:calc(12px*var(--fs));padding:6px 4px}
.banner{background:#2c2415;color:#f2c35b;border-radius:16px;padding:12px 16px;margin-bottom:12px;font-size:calc(13px*var(--fs));display:flex;gap:10px;align-items:center}
.sw{width:50px;height:30px;border-radius:999px;background:#44454c;position:relative;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--blue)}.sw.on::after{left:23px}
.subchips{display:flex;gap:8px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none}
.subchips button{flex:none;background:var(--card2);border:2px solid transparent;border-radius:999px;padding:6px 14px;color:var(--text);font-size:calc(14px*var(--fs));display:flex;align-items:center;gap:8px}
.subchips button.on{border-color:#fff}
.subchips button .ico{width:16px;height:16px}

.slider{width:100%;accent-color:var(--blue)}
.setrow{display:flex;align-items:center;gap:12px;padding:10px 4px}
.setrow .nm{font-size:calc(17px*var(--fs))}
.setrow .val{color:var(--muted);min-width:46px;text-align:right}
.accents{display:flex;gap:10px;flex-wrap:wrap;padding:6px 4px}
.accents span{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}
.accents span.on{border-color:#fff}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <nav class="bnav" id="bnav"></nav>
  <button class="fab" id="fab" onclick="A.newTx()" aria-label="Add transaction"></button>
  <div id="sheets"></div>
  <div id="overlay"></div>
</div>
<input type="file" id="fileRestore" accept=".json,application/json" style="display:none" onchange="A.restoreFile(this)">
<input type="file" id="fileCsv" accept=".csv,text/csv" style="display:none" onchange="A.importCsvFile(this)">
<script>
'use strict';
/* ===================== ICONS (stroke SVG, 24x24) ===================== */
const ICONS={
home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',

piggy:'<path d="M5.5 11.5a6.5 5.5 0 0 1 13 0c0 1.4-.4 2.4-1 3.2L18 18h-2.6l-.5-1.6h-4.8L9.6 18H7l.5-3.3"/><circle cx="15" cy="10.5" r=".9" fill="currentColor"/><path d="M18.5 9.5H21v4h-2"/><path d="M3 10.5v3h2.5"/><path d="M9 7.5c1.5-1 3.5-1 5 0"/>',
shirt:'<path d="M8.5 3l3.5 2 3.5-2L21 6.5l-2.5 3.5L17 9v12H7V9L5.5 10 3 6.5z"/>',

bag:'<path d="M6 7h12l1 13H5z"/><path d="M9 7V6a3 3 0 0 1 6 0v1"/>',
scooter:'<circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M6 17h7l3-7h3"/><path d="M13 6h3.5l2.5 4"/><path d="M11 10l2 7"/>',
food:'<path d="M5 3v8a3 3 0 0 0 3 3v7"/><path d="M8 3v8"/><path d="M11 3v8"/><path d="M18.5 3c-2 0-3.5 3-3.5 6.5V13h3.5v8"/>',
phone:'<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/>',

const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const today=()=>toISO(new Date());
const nowTime=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const addDays=(s,n)=>{const d=fromISO(s);d.setDate(d.getDate()+n);return toISO(d);};
const diffDays=(a,b)=>Math.round((fromISO(b)-fromISO(a))/86400000);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=MONTHS.map(m=>m.slice(0,3));
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAY3=DAYS.map(d=>d.slice(0,3));
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const clampDate=(y,m,d)=>{while(m<0){m+=12;y--;}while(m>11){m-=12;y++;}return `${y}-${pad(m+1)}-${pad(Math.min(d,dim(y,m)))}`;};
function monthOf(off){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return {y:d.getFullYear(),m:d.getMonth()};}
function monthRange(off){const {y,m}=monthOf(off);return {start:`${y}-${pad(m+1)}-01`,end:`${y}-${pad(m+1)}-${pad(dim(y,m))}`,y,m,label:MONTHS[m]+' '+y};}
function weekStartOf(s){const d=fromISO(s);const wd=(d.getDay()+7-(S.settings.weekStart||1))%7;return addDays(s,-wd);}
function fmtDate(s){const d=fromISO(s);return `${d.getDate()} ${MON3[d.getMonth()]} ${d.getFullYear()}`;}
function fmtDateShort(s){const d=fromISO(s);return `${MON3[d.getMonth()]} ${pad(d.getDate())}`;}
function fmtTime(t){if(!t)return '';let [h,m]=t.split(':').map(Number);const ap=h>=12?'pm':'am';h=h%12||12;return `${h}:${pad(m)} ${ap}`;}
function periodRange(kind,off){const t=today();
 if(kind==='week'){const ws=weekStartOf(t);const start=addDays(ws,off*7),end=addDays(start,6);const a=fromISO(start),b=fromISO(end);const label=a.getMonth()===b.getMonth()?`${a.getDate()} – ${b.getDate()} ${MON3[b.getMonth()]} ${b.getFullYear()}`:`${a.getDate()} ${MON3[a.getMonth()]} – ${b.getDate()} ${MON3[b.getMonth()]} ${b.getFullYear()}`;return {start,end,label};}
 if(kind==='month'){const r=monthRange(off);return {start:r.start,end:r.end,label:r.label};}
 if(kind==='year'){const y=new Date().getFullYear()+off;return {start:`${y}-01-01`,end:`${y}-12-31`,label:String(y)};}
 let first=t;for(const x of S.transactions)if(x.date<first)first=x.date;if(diffDays(first,t)<30)first=addDays(t,-30);return {start:first,end:t,label:'All time'};
}

 if(remote&&(remote.updated||0)>(S.meta.updated||0)){const R=JSON.parse(remote.json);R.settings=Object.assign(defaultSettings(),R.settings||{});S=R;persist();cloud.status='synced';render();sheets.length&&rerenderTop();toast('Loaded your data from cloud');}
 else{cloud.status='synced';if(!remote||(S.meta.updated||0)>(remote.updated||0))cloudPush(true);}render();}catch(e){console.warn('cloud',e);cloud.status='local';}}
function cloudPush(now){if(!cloud.ref)return;clearTimeout(cloud.t);cloud.t=setTimeout(async()=>{if(cloud.busy){cloud.dirty=true;return;}cloud.busy=true;try{await cloud.ref.set({json:JSON.stringify(S),updated:S.meta.updated||Date.now()});cloud.status='synced';}catch(e){console.warn('cloud push',e);cloud.status='error';}cloud.busy=false;if(cloud.dirty){cloud.dirty=false;cloudPush();}},now?0:1500);}

const GROUPS=[['cash','Cash'],['bank','Bank'],['wallet','Wallets'],['investment','Investments'],['credit','Credit cards'],['other','Other']];
const groupLabel=k=>(GROUPS.find(g=>g[0]===k)||['','Other'])[1];
function inferGroup(a){if(a.type==='credit')return 'credit';const n=(a.name||'').toLowerCase();if(/wallet|mobikwik|paytm|phonepe|gpay|amazon pay|upi/.test(n))return 'wallet';if(/fund|groww|zerodha|mutual|stock|share|sip|\bfd\b|gold|invest|ppf|nps/.test(n))return 'investment';if(/bank|\bau\b|sbi|hdfc|icici|axis|kotak|canara/.test(n))return 'bank';if(/cash/.test(n))return 'cash';return 'other';}

/* ===================== MONEY ===================== */
function num(n){return Math.round((+n||0)*100)/100;}
function fmt(n,o){o=o||{};const st=S.settings;if(st.hideBalances&&!o.force)return st.currency+'••••';let v=num(n);const a=Math.abs(v);const loc=st.numFmt==='indian'?'en-IN':'en-US';const str=(Number.isInteger(a)&&st.decimals!=='always')?a.toLocaleString(loc):a.toLocaleString(loc,{minimumFractionDigits:2,maximumFractionDigits:2});let out=st.currency+str;if(v<0&&!o.abs)out='-'+out;else if(o.sign&&v>0)out='+'+out;return out;}
function fmtK(n){const a=Math.abs(n);let s;if(a>=1e6)s=(a/1e6).toFixed(a%1e6?1:0).replace(/\.0$/,'')+'M';else if(a>=1000)s=(a/1000).toFixed(a%1000?1:0).replace(/\.0$/,'')+'k';else s=Math.round(a).toString();return (n<0?'-':'')+S.settings.currency+s;}
function cls(n){return n>0?'pos':n<0?'neg':'';}

/* ===================== ENGINE ===================== */
function txSign(t,id){if(t.type==='income')return t.accountId===id?1:0;if(t.type==='expense')return t.accountId===id?-1:0;let s=0;if(t.accountId===id)s-=1;if(t.toAccountId===id)s+=1;return s;}
function accBalance(id,upto){const a=acc(id);if(!a)return 0;let b=a.opening||0;for(const t of S.transactions){if(upto&&t.date>upto)continue;const s=txSign(t,id);if(s)b+=s*t.amount;}return num(b);}
function deltaByDate(ids){const set=new Set(ids);const m={};for(const t of S.transactions){let d=0;if(t.type==='transfer'){if(set.has(t.accountId))d-=t.amount;if(set.has(t.toAccountId))d+=t.amount;}else if(set.has(t.accountId))d+=t.type==='income'?t.amount:-t.amount;if(d)m[t.date]=(m[t.date]||0)+d;}return m;}
function series(ids,start,end){const m=deltaByDate(ids);let base=ids.reduce((s,id)=>s+(acc(id).opening||0),0);let change=0;for(const d in m){if(d<start)base+=m[d];else if(d<=end)change+=m[d];}const pts=[];let v=base;for(let d=start;d<=end;d=addDays(d,1)){v+=m[d]||0;pts.push({date:d,value:num(v)});}return {pts,base:num(base),change:num(change)};}
function flow(start,end,f){f=f||{};let income=0,expense=0;for(const t of S.transactions){if(t.type==='transfer')continue;if(t.date<start||t.date>end)continue;if(f.accIds&&!f.accIds.includes(t.accountId))continue;if(f.catIds&&!f.catIds.includes(t.categoryId))continue;if(t.type==='income')income+=t.amount;else expense+=t.amount;}return {income:num(income),expense:num(expense),net:num(income-expense)};}
function txIn(start,end){return S.transactions.filter(t=>t.date>=start&&t.date<=end);}
function budgetSpent(b,off){const r=monthRange(off||0);let s=0;for(const t of S.transactions){if(t.type!=='expense'||t.date<r.start||t.date>r.end)continue;if(b.categoryIds&&b.categoryIds.length&&!b.categoryIds.includes(t.categoryId))continue;if(b.accountIds&&b.accountIds.length&&!b.accountIds.includes(t.accountId))continue;s+=t.amount;}return num(s);}
function creditInfo(a){const c=a.credit||{};const t=today();const d=fromISO(t);const sd=Math.min(31,Math.max(1,c.statementDay||1)),dd=Math.min(31,Math.max(1,c.dueDay||1));
 let y=d.getFullYear(),m=d.getMonth();let last=clampDate(y,m,sd);if(last>t){m--;if(m<0){m=11;y--;}last=clampDate(y,m,sd);}
 const next=clampDate(y,m+1,sd);
 let due=clampDate(y,m,dd);if(due<=last)due=clampDate(y,m+1,dd);
 const balNow=accBalance(a.id),balStmt=accBalance(a.id,last);
 let paid=0,unbilled=0;for(const x of S.transactions){if(x.date<=last)continue;if(x.type==='transfer'&&x.toAccountId===a.id)paid+=x.amount;if(x.type==='income'&&x.accountId===a.id)paid+=x.amount;if(x.type==='expense'&&x.accountId===a.id)unbilled+=x.amount;if(x.type==='transfer'&&x.accountId===a.id)unbilled+=x.amount;}
 const stmtDue=num(Math.max(0,-balStmt-paid));const outstanding=num(Math.max(0,-balNow));const limit=c.limit||0;const available=limit?num(limit-outstanding):null;
 return {last,next,due,stmtDue,outstanding,limit,available,unbilled:num(unbilled),daysToDue:diffDays(t,due),daysToStmt:diffDays(t,next),overdue:stmtDue>0&&t>due,balNow,cycleStart:addDays(last,1)};
}
function postRecurring(){const t=today();let n=0;for(const r of S.recurring){if(!r.active)continue;let guard=0;while(r.nextDate&&r.nextDate<=t&&guard++<400){const x=Object.assign({},r.template,{id:uid(),date:r.nextDate,recurringId:r.id});S.transactions.push(x);n++;r.nextDate=advance(r.nextDate,r.freq);}}if(n){sortTx();save();toast(n+' scheduled transaction'+(n>1?'s':'')+' added');}}
function advance(d,freq){const x=fromISO(d);if(freq==='daily')return addDays(d,1);if(freq==='weekly')return addDays(d,7);if(freq==='monthly')return clampDate(x.getFullYear(),x.getMonth()+1,x.getDate());return clampDate(x.getFullYear()+1,x.getMonth(),x.getDate());}

/* ===================== CHARTS ===================== */
function monoPath(xs,ys){const n=xs.length;if(n<2)return '';if(n===2)return `M${xs[0]},${ys[0]}L${xs[1]},${ys[1]}`;const dx=[],m=[];for(let i=0;i<n-1;i++){dx[i]=xs[i+1]-xs[i]||1e-6;m[i]=(ys[i+1]-ys[i])/dx[i];}const t=[m[0]];for(let i=1;i<n-1;i++)t[i]=(m[i-1]*m[i]<=0)?0:(m[i-1]+m[i])/2;t[n-1]=m[n-2];for(let i=0;i<n-1;i++){if(m[i]===0){t[i]=0;t[i+1]=0;}else{const a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;if(s>9){const k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i];}}}let d=`M${xs[0].toFixed(1)},${ys[0].toFixed(1)}`;for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=`C${(xs[i]+h).toFixed(1)},${(ys[i]+h*t[i]).toFixed(1)},${(xs[i+1]-h).toFixed(1)},${(ys[i+1]-h*t[i+1]).toFixed(1)},${xs[i+1].toFixed(1)},${ys[i+1].toFixed(1)}`;}return d;}
let gid=0;
function lineChart(o){const w=o.w||380,h=o.h||190,padL=o.padL||62,padR=12,padT=12,padB=28;const all=[];o.series.forEach(s=>s.values.forEach(v=>all.push(v)));let lo=Math.min(0,...all),hi=Math.max(0,...all);if(hi===lo)hi=lo+100;const span=hi-lo;hi+=span*0.04;if(lo<0)lo-=span*0.04;const n=Math.max(...o.series.map(s=>s.values.length));const X=i=>n>1?padL+i/(n-1)*(w-padL-padR):padL;const Y=v=>padT+(hi-v)/(hi-lo)*(h-padT-padB);const id='g'+(++gid);
 let ticks=[];const steps=o.ticks||3;for(let i=0;i<=steps;i++)ticks.push(hi-(hi-lo)*i/steps);if(lo<0&&!ticks.some(t=>Math.abs(t)<span*.02))ticks.push(0);
 let svg=`<svg class="chart" viewBox="0 0 ${w} ${h}" style="max-height:${h}px"><defs>`;
 o.series.forEach((s,k)=>{svg+=`<linearGradient id="${id}f${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".35"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient>`;});
 svg+=`<linearGradient id="${id}neg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ec5f4f" stop-opacity=".35"/><stop offset="1" stop-color="#ec5f4f" stop-opacity="0"/></linearGradient><clipPath id="${id}up"><rect x="0" y="0" width="${w}" height="${Y(0)}"/></clipPath><clipPath id="${id}dn"><rect x="0" y="${Y(0)}" width="${w}" height="${h}"/></clipPath></defs>`;
 ticks.forEach(t=>{svg+=`<text x="${padL-8}" y="${Y(t)+5}" fill="#9a9ca4" font-size="14" text-anchor="end">${o.yfmt?o.yfmt(t):fmtK(t)}</text>`;});
 o.series.forEach((s,k)=>{if(!s.values.length)return;const xs=s.values.map((_,i)=>X(i)),ys=s.values.map(Y);const p=monoPath(xs,ys);if(!p){svg+=`<circle cx="${(w+padL)/2}" cy="${ys[0]}" r="5" fill="${s.color}"/>`;return;}const y0=Y(0);const area=p+`L${xs[xs.length-1].toFixed(1)},${y0}L${xs[0].toFixed(1)},${y0}Z`;
  if(s.neg){svg+=`<path d="${area}" fill="url(#${id}f${k})" clip-path="url(#${id}up)"/><path d="${area}" fill="url(#${id}neg)" clip-path="url(#${id}dn)"/><path d="${p}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#${id}up)"/><path d="${p}" fill="none" stroke="#ec5f4f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" clip-path="url(#${id}dn)"/>`;}
  else{if(s.fill)svg+=`<path d="${area}" fill="url(#${id}f${k})"/>`;svg+=`<path d="${p}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;}
  if(s.values.length===1)svg+=`<circle cx="${xs[0]}" cy="${ys[0]}" r="5" fill="${s.color}"/>`;});
 (o.labels||[]).forEach(l=>{svg+=`<text x="${X(l.i)}" y="${h-6}" fill="#c8c9cf" font-size="14" text-anchor="${l.anchor||'middle'}">${l.text}</text>`;});
 return svg+'</svg>';}
function arcPath(cx,cy,r,a0,a1){const rad=a=>(a-90)*Math.PI/180;const x0=cx+r*Math.cos(rad(a0)),y0=cy+r*Math.sin(rad(a0)),x1=cx+r*Math.cos(rad(a1)),y1=cy+r*Math.sin(rad(a1));return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r},0,${a1-a0>180?1:0},1,${x1.toFixed(2)},${y1.toFixed(2)}`;}
function donut(o){const size=o.size||300,thick=o.thick||18,extra=o.labels?150:0,r=size/2-thick/2-(o.labels?40:2),cx=(size+extra)/2,cy=size/2;const total=o.slices.reduce((s,x)=>s+x.value,0);let svg=`<svg viewBox="0 0 ${size+extra} ${size}" style="width:100%;max-width:${size+extra}px;display:block;margin:0 auto">`;
 if(total<=0){for(let i=0;i<4;i++)svg+=`<path d="${arcPath(cx,cy,r,i*90+3,i*90+87)}" fill="none" stroke="#2a2b30" stroke-width="${thick}" stroke-linecap="butt"/>`;}
 else{let a=0;const gap=o.slices.filter(s=>s.value>0).length>1?3:0;o.slices.forEach(s=>{if(s.value<=0)return;const ang=s.value/total*360;const a0=a+gap/2,a1=a+ang-gap/2;if(a1>a0)svg+=`<path d="${arcPath(cx,cy,r,a0,Math.min(a1,a0+359.9))}" fill="none" stroke="${s.color}" stroke-width="${thick}" stroke-linecap="butt"/>`;
  if(o.labels&&ang>=14){const mid=(a+ang/2-90)*Math.PI/180;const x1=cx+(r+thick/2+4)*Math.cos(mid),y1=cy+(r+thick/2+4)*Math.sin(mid),x2=cx+(r+thick/2+16)*Math.cos(mid),y2=cy+(r+thick/2+16)*Math.sin(mid);const rightSide=Math.cos(mid)>=0;const x3=x2+(rightSide?14:-14);let lab=s.label||'';if(lab.length>13)lab=lab.slice(0,11)+'…';svg+=`<path d="M${x1},${y1}L${x2},${y2}L${x3},${y2}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="${x3+(rightSide?6:-6)}" y="${y2+5}" fill="#ececef" font-size="17" text-anchor="${rightSide?'start':'end'}">${esc(lab)}</text>`;}
  a+=ang;});}
 svg+='</svg>';return `<div style="position:relative">${svg}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center">${o.center||''}</div></div>`;}
function ring(pct,color,icon){const r=25,c=2*Math.PI*r;const p=Math.min(1,Math.max(0,pct));return `<div class="ring"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="${r}" fill="none" stroke="#2c2d33" stroke-width="4"/><circle cx="28" cy="28" r="${r}" fill="none" stroke="${pct>1?'#ec5f4f':color}" stroke-width="4" stroke-dasharray="${(p*c).toFixed(1)} ${c.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 28 28)"/></svg>${tile(icon,color,'lg round')}<div class="p">${Math.round(pct*100)}%</div></div>`;}

const sheets=[];

function closeSheet(){if(sheets.length)history.back();}
window.addEventListener('popstate',()=>{const want=(history.state&&history.state.n)||0;while(sheets.length>want)sheets.pop();closeMenu();drawSheets();});
history.replaceState({n:0},'');
function drawSheets(){const host=document.getElementById('sheets');host.innerHTML='';sheets.forEach((s,i)=>{if(s.cls==='tx'){const sc=document.createElement('div');sc.className='txscrim';sc.onclick=closeSheet;host.appendChild(sc);}const d=document.createElement('div');d.className='sheet '+s.cls;d.id='sheet-'+i;d.innerHTML=safeRender(s);host.appendChild(d);if(s.cls==='tx'){attachTxSwipe(d);fixTxHeight(d);scrollChipIntoView(d);}});document.body.style.overflow=sheets.length?'hidden':'';document.getElementById('fab').style.display=sheets.length?'none':'';}
function rerenderTop(){if(!sheets.length)return;const i=sheets.length-1;const d=document.getElementById('sheet-'+i);if(d){const sc=d.scrollTop;d.innerHTML=safeRender(sheets[i]);d.scrollTop=sc;if(sheets[i].cls==='tx'){fixTxHeight(d);scrollChipIntoView(d);}}}
function refresh(){save();render();sheets.forEach((s,i)=>{if(!s.live)return;const d=document.getElementById('sheet-'+i);if(d){const sc=d.scrollTop;d.innerHTML=safeRender(s);d.scrollTop=sc;}});}

let toastT=null;function toast(m){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t);}t.textContent=m;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2200);}

 d.addEventListener('touchend',e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<55||Math.abs(dy)>Math.abs(dx)*0.6)return;if(!t0||t0.closest('.chips,.subchips,input,.seg'))return;const dir=dx<0?1:-1;if(t0.closest('.keypad'))A.txCycleAcc(dir);else if(t0.closest('.txbody,.hdr'))A.txCycleType(dir);},{passive:true});}

 if(!ui.txBodyH){const cur={type:ui.tx.type,cat:ui.tx.categoryId,sub:ui.tx.subId};const probe=document.createElement('div');probe.className='sheet tx';probe.style.cssText='visibility:hidden;pointer-events:none;';document.body.appendChild(probe);let max=0;
  ['income','expense','transfer'].forEach(t=>{ui.tx.type=t;if(t!=='transfer'){const f=catsOf(t)[0];ui.tx.categoryId=f?f.id:null;ui.tx.subId=null;}probe.innerHTML=renderTxSheet();const b=probe.querySelector('.txbody');if(b)max=Math.max(max,b.scrollHeight);});
  ui.tx.type=cur.type;ui.tx.categoryId=cur.cat;ui.tx.subId=cur.sub;probe.remove();
  const kp=d.querySelector('.keypad'),hd=d.querySelector('.hdr');const avail=window.innerHeight-(kp?kp.offsetHeight:0)-(hd?hd.offsetHeight:0)-24;ui.txBodyH=Math.min(max,avail);}

function renderHome(){const st=S.settings;const period=periodRange(ui.homePeriod,ui.homeOff);const ids=(st.balanceFilter||liveAccounts().map(a=>a.id)).filter(id=>acc(id)&&!acc(id).archived);const ser=series(ids,period.start,period.end);const t=today();const endIdx=ser.pts.findIndex(p=>p.date>t);const shown=endIdx===-1?ser.pts[ser.pts.length-1]:ser.pts[Math.max(0,endIdx-1)];const bal=shown?shown.value:ser.base;
 const vis=ser.pts.filter(p=>p.date<=t);const pts=vis.length?vis:ser.pts;const labels=xLabels(pts,ui.homePeriod);
 let h=`<div class="title"><span>Home</span><button class="ibtn muted" onclick="A.toggleHide()">${ic(st.hideBalances?'eyeOff':'eye')}</button><button class="ibtn muted" onclick="A.settings()" title="${cloud.status}">${ic(cloud.status==='synced'?'cloud':'cloudOff')}</button><button class="ibtn muted" onclick="A.settings()">${ic('gear')}</button></div>`;
 if(st.backupDays>0&&S.transactions.length>0&&(!st.lastBackup||diffDays(st.lastBackup,t)>=st.backupDays))h+=`<div class="banner" onclick="A.backup()">${ic('cloudOff')}<span>${st.backupDays===1?"Today's backup not saved yet — tap to save a backup file.":'No backup in a while — tap to back up your data.'}</span></div>`;
 h+=`<div class="card"><div class="chead"><h2 class="t">Total balance</h2><button class="ibtn muted" onclick="A.balanceFilter()">${ic('filter')}</button></div>
 <div class="seg">${['week','month','year','all'].map(k=>`<button class="${ui.homePeriod===k?'on':''}" onclick="A.homePeriod('${k}')">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>
 <div class="row" style="margin-top:18px"><div class="grow"><div class="big">${fmt(bal)}</div><div class="sub" style="font-size:calc(17px*var(--fs));margin-top:2px"><span class="${cls(ser.change)}">${fmt(ser.change,{sign:true})}</span> ${period.label}</div></div>
 ${ui.homePeriod!=='all'?`<button class="ibtn" onclick="A.homeOff(-1)">${ic('chevL')}</button><button class="ibtn ${ui.homeOff>=0?'muted':''}" onclick="A.homeOff(1)">${ic('chevR')}</button>`:''}</div>
 <div style="margin-top:10px">${lineChart({series:[{values:pts.map(p=>p.value),color:'#4d87f5',fill:true,neg:true}],labels})}</div></div>`;
 const CARDS={
 credit:()=>{const credits=liveAccounts().filter(a=>a.type==='credit'&&!a.hideHome);if(!credits.length)return '';const owed=credits.reduce((s,a)=>s+Math.max(0,-accBalance(a.id)),0);let h=`<div class="card"><div class="chead"><div class="t"><h2>Credit cards</h2></div><div class="right" style="margin-right:4px"><div class="${owed>0?'neg':''}" style="font-size:calc(18px*var(--fs))">${fmt(owed)}</div><div class="small">outstanding</div></div><button class="ibtn muted" onclick="A.accounts()">${ic('chevR')}</button></div>`;
  credits.forEach(a=>{const ci=creditInfo(a);const used=ci.limit?Math.min(1,ci.outstanding/ci.limit):0;h+=`<div class="li tap" onclick="A.openAccount('${a.id}')">${tile(a.icon,a.color)}<div class="grow"><div class="nm ell">${esc(a.name)}</div><div class="sb">${ci.stmtDue>0?`Due ${fmt(ci.stmtDue)} · ${ci.overdue?'<span class="neg">overdue</span>':ci.daysToDue===0?'<span class="neg">today</span>':'in '+ci.daysToDue+' day'+(ci.daysToDue===1?'':'s')+' ('+fmtDateShort(ci.due)+')'}`:`Nothing due · statement ${fmtDateShort(ci.next)}`}</div>${ci.limit?`<div class="crow" style="padding:0"><div class="bar" style="margin-top:6px;height:6px"><i style="width:${(used*100).toFixed(1)}%;background:${used>.9?'#ec5f4f':a.color}"></i></div></div>`:''}</div><div class="right"><div style="font-size:calc(17px*var(--fs))" class="${ci.outstanding>0?'neg':''}">${ci.outstanding>0?fmt(ci.outstanding):fmt(ci.balNow)}</div>${ci.limit?`<div class="small">of ${fmtK(ci.limit)}</div>`:''}</div></div>`;});return h+'</div>';},
 accounts:()=>{const vis=liveAccounts().filter(a=>a.type!=='credit'&&!a.hideHome);const total=vis.reduce((s,a)=>s+accBalance(a.id),0);let h=`<div class="chead"><div class="t"><h2>Accounts</h2></div><div class="right" style="margin-right:4px"><div class="${total<0?'neg':''}" style="font-size:calc(18px*var(--fs))">${fmt(total)}</div></div><button class="ibtn muted" onclick="A.accounts()">${ic('chevR')}</button></div>`;
  const bals={};vis.forEach(a=>bals[a.id]=accBalance(a.id));const maxAbs=Math.max(1,...vis.map(a=>Math.abs(bals[a.id])));
  GROUPS.forEach(([k,label])=>{const list=vis.filter(a=>(a.group||inferGroup(a))===k);if(!list.length)return;const sub=list.reduce((s,a)=>s+bals[a.id],0);h+=`<div class="grp"><div class="row grph"><div class="grow">${label}</div><div class="${sub<0?'neg':''}">${fmt(sub)}</div></div>`;
   list.forEach(a=>{const b=bals[a.id];const w=Math.abs(b)/maxAbs*100;h+=`<div class="arow" onclick="A.openAccount('${a.id}')">${tile(a.icon,a.color,'',a.fav?`<span class="badge">${ic('heart')}</span>`:'')}<div class="grow"><div class="row"><div class="n grow ell">${esc(a.name)}</div><div class="b ${b<0?'neg':''}">${fmt(b)}</div></div><div class="bar"><i style="width:${w.toFixed(1)}%;background:${b<0?'#ec5f4f':a.color}"></i></div></div></div>`;});h+='</div>';});
  if(!vis.length)h+='<div class="empty">No accounts shown. Turn them on in Accounts → edit.</div>';return `<div class="card">${h}</div>`;},
 categories:()=>{const r=monthRange(0);const type=st.homeCatType;const rows=catsOf(type).map(c=>({c,v:flow(r.start,r.end,{catIds:[c.id]})[type]})).sort((a,b)=>b.v-a.v);
  return `<div class="card"><div class="chead"><div class="t"><h2>Categories</h2><div class="sub">${r.label}</div></div><button class="ibtn muted" onclick="A.homeCatMenu(event)">${ic('more')}</button></div>
  <div class="row" style="align-items:flex-start"><div style="width:44%;flex:none;cursor:pointer" onclick="A.tab('cats')">${donut({size:150,thick:14,slices:rows.map(x=>({value:x.v,color:x.c.color})),center:`<span class="${type==='income'?'pos':'neg'}" style="font-size:calc(15px*var(--fs))">${type==='income'?'Income':'Expenses'}</span>`})}</div>
  <div class="grow" style="padding-top:4px">${rows.slice(0,5).map(x=>`<div class="row" style="gap:10px;padding:4px 0;cursor:pointer" onclick="A.catDetail('${x.c.id}',0)">${tile(x.c.icon,x.c.color,'xs round')}<div class="grow ell" style="font-size:calc(15px*var(--fs))">${esc(x.c.name)}</div><div class="${type==='income'?'pos':'neg'}" style="font-size:calc(15px*var(--fs))">${fmt(x.v)}</div></div>`).join('')||'<div class="empty">No categories</div>'}</div></div></div>`;},
 cashflow:()=>{const cp=st.cashflowPeriod;const rr=cfRange(cp);const f=flow(rr.start,rr.end);return `<div class="card"><div class="chead"><div class="t"><h2>Cash flow</h2><div class="sub">${rr.label}</div></div><button class="ibtn muted" onclick="A.cfMenu(event)">${ic('more')}</button></div>${cashflowRows(f)}</div>`;},
 budgets:()=>{let h=`<div class="card"><div class="chead"><h2 class="t">Budgets</h2><button class="ibtn muted" onclick="A.budgets()">${ic('chevR')}</button></div>`;
  if(!S.budgets.length)h+=`<div class="empty">No budgets yet. <span class="link" onclick="A.editBudget()">Add one</span></div>`;
  S.budgets.forEach(b=>{const sp=budgetSpent(b,0);const left=b.amount-sp;h+=`<div class="brow" onclick="A.editBudget('${b.id}')">${ring(b.amount?sp/b.amount:0,b.color,b.icon)}<div class="grow" style="padding-bottom:10px"><div style="font-size:calc(18px*var(--fs))">${esc(b.name)}</div><div class="sub" style="font-size:calc(15px*var(--fs))">${fmt(sp)} of ${fmt(b.amount)}</div></div><div class="${left>=0?'pos':'neg'}" style="font-size:calc(18px*var(--fs));padding-bottom:10px">${fmt(left)}</div></div>`;});return h+'</div>';}};
 (st.homeOrder||[]).forEach(k=>{if(st.homeCards[k]&&CARDS[k])h+=CARDS[k]();});
 h+=`<div class="center" style="padding:10px"><span class="sub" style="font-size:calc(17px*var(--fs));cursor:pointer" onclick="A.settings()">Edit</span></div>`;
 return h;}
function cfRange(cp){const t=today();if(cp==='today')return {start:t,end:t,label:'Today'};if(cp==='week'){const r=periodRange('week',0);return {start:r.start,end:r.end,label:'This week'};}if(cp==='year'){const y=new Date().getFullYear();return {start:`${y}-01-01`,end:`${y}-12-31`,label:String(y)};}if(cp==='all')return {start:'0000-01-01',end:'9999-12-31',label:'All time'};const r=monthRange(0);return {start:r.start,end:r.end,label:r.label};}
function cashflowRows(f){return `<div class="kv"><span class="row" style="gap:12px">${tile('arrowUp','#34c77b','xs round')}Income</span><span class="pos">${fmt(f.income)}</span></div><div class="kv"><span class="row" style="gap:12px">${tile('arrowDown','#ec5f4f','xs round')}Expenses</span><span class="neg">${fmt(f.expense)}</span></div><div class="hr"></div><div class="kv" style="padding-left:40px"><span class="k">Total:</span><span class="${cls(f.net)}">${fmt(f.net,{sign:true})}</span></div>`;}
function xLabels(pts,kind){const n=pts.length;if(!n)return [];const L=[];if(kind==='week'){pts.forEach((p,i)=>L.push({i,text:DAY3[fromISO(p.date).getDay()]}));}
 else if(kind==='month'){pts.forEach((p,i)=>{const d=fromISO(p.date).getDate();if(d===1||d===10||d===20||d===30)L.push({i,text:fmtDateShort(p.date),anchor:i===0?'start':i===n-1?'end':'middle'});});}
 else if(kind==='year'){pts.forEach((p,i)=>{const d=fromISO(p.date);if(d.getDate()===1&&d.getMonth()%2===0)L.push({i,text:MON3[d.getMonth()],anchor:i===0?'start':'middle'});});}
 else{const k=Math.min(4,n);for(let j=0;j<k;j++){const i=Math.round(j*(n-1)/(k-1||1));const d=fromISO(pts[i].date);L.push({i,text:j===0?`${MON3[d.getMonth()]} ${d.getFullYear()}`:MON3[d.getMonth()],anchor:j===0?'start':j===k-1?'end':'middle'});}}
 return L;}
A.homePeriod=k=>{ui.homePeriod=k;ui.homeOff=0;render();};
A.homeOff=d=>{ui.homeOff=Math.min(0,ui.homeOff+d);render();};
A.homeCatMenu=e=>menu(e,[{label:'Income',on:S.settings.homeCatType==='income',act:()=>{S.settings.homeCatType='income';refresh();}},{label:'Expenses',on:S.settings.homeCatType==='expense',act:()=>{S.settings.homeCatType='expense';refresh();}}]);
A.cfMenu=e=>menu(e,[['today','Today'],['week','This week'],['month','This month'],['year','This year'],['all','All time']].map(([k,l])=>({label:l,on:S.settings.cashflowPeriod===k,act:()=>{S.settings.cashflowPeriod=k;refresh();}})));
A.balanceFilter=()=>openSheet('balfilter',()=>{const sel=S.settings.balanceFilter;const all=!sel;const ids=sel||[];return `<div class="hdr"><button class="ibtn" onclick="closeSheet()">${ic('close')}</button><h1 class="c">Total balance filter</h1><span style="width:42px"></span></div>
 <div class="li tap" onclick="A.bfAll()">${tile('checkAll','#5a3a3f')}<div class="grow nm">All accounts</div><span class="cb ${all?'on':''}">${all?ic('check'):''}</span></div><div class="hr"></div>
 ${liveAccounts().map(a=>{const on=all||ids.includes(a.id);return `<div class="li tap" onclick="A.bfToggle('${a.id}')">${tile(a.icon,a.color,'',a.fav?`<span class="badge">${ic('heart')}</span>`:'')}<div class="grow"><div class="nm">${esc(a.name)}</div><div class="sb">${fmt(accBalance(a.id))}</div></div><span class="cb ${on?'on':''}">${on?ic('check'):''}</span></div>`;}).join('')}
 <div class="btnrow"><button class="btn w" onclick="closeSheet()">Done</button></div>`;});
A.bfAll=()=>{S.settings.balanceFilter=null;refresh();};
A.bfToggle=id=>{let f=S.settings.balanceFilter||liveAccounts().map(a=>a.id);f=f.includes(id)?f.filter(x=>x!==id):f.concat(id);S.settings.balanceFilter=f;refresh();};

function renderCats(){const r=monthRange(ui.catOff);const type=ui.catType;const rows=catsOf(type).map(c=>({c,v:flow(r.start,r.end,{catIds:[c.id]})[type]})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);const total=rows.reduce((s,x)=>s+x.v,0);const f=flow(r.start,r.end);
 let h=`<div class="title"><span>Categories</span><button class="ibtn muted" onclick="A.manageCats()">${ic('pencil')}</button></div>`;
 h+=mnav(r.label,'A.catOff(-1)','A.catOff(1)',`<button class="ibtn muted" onclick="A.catTypeMenu(event)">${ic('filter')}</button>`);
 h+=donut({size:360,thick:20,labels:true,slices:rows.map(x=>({value:x.v,color:x.c.color,label:x.c.name})),center:`<div style="font-size:calc(26px*var(--fs))" class="${type==='expense'?'neg':'pos'}">${fmt(type==='expense'?f.expense:f.income)}</div><div style="font-size:calc(21px*var(--fs))" class="${type==='expense'?'pos':'neg'}">${fmt(type==='expense'?f.income:f.expense)}</div>`});
 if(!rows.length)h+=`<div class="empty">No ${type==='expense'?'expenses':'income'} in ${r.label}</div>`;
 rows.forEach(x=>{const pc=total?x.v/total:0;h+=`<div class="crow" onclick="A.catDetail('${x.c.id}',${ui.catOff})">${tile(x.c.icon,x.c.color,'lg round')}<div class="grow"><div class="row"><div class="nm grow ell">${esc(x.c.name)}</div><div class="am ${type==='expense'?'neg':'pos'}">${fmt(x.v)}</div></div><div class="row" style="gap:12px"><div class="bar"><i style="width:${(pc*100).toFixed(1)}%;background:${x.c.color}"></i></div><div class="pc" style="width:44px;margin:0">${pc<.01?'<1':Math.round(pc*100)}%</div></div></div></div>`;});
 return h;}
A.catOff=d=>{ui.catOff+=d;render();};
A.catTypeMenu=e=>menu(e,[{label:'Income',on:ui.catType==='income',act:()=>{ui.catType='income';render();}},{label:'Expenses',on:ui.catType==='expense',act:()=>{ui.catType='expense';render();}}]);
A.catDetail=(id,off)=>openSheet('catdetail',()=>{const c=cat(id);if(!c)return '';const r=monthRange(off);const list=txIn(r.start,r.end).filter(t=>t.categoryId===id);const total=list.reduce((s,t)=>s+t.amount,0);const subs={};list.forEach(t=>{const k=t.subId||'_';subs[k]=(subs[k]||0)+t.amount;});
 return `<div class="hdr"><button class="ibtn" onclick="closeSheet()">${ic('close')}</button><h1>${esc(c.name)}</h1><button class="ibtn" onclick="A.editCat('${c.id}')">${ic('pencil')}</button></div>
 <div class="row" style="padding:6px 4px 14px">${tile(c.icon,c.color,'lg round')}<div class="grow"><div class="sub">${r.label}</div><div class="big ${c.type==='expense'?'neg':'pos'}" style="font-size:calc(28px*var(--fs))">${fmt(total)}</div></div></div>
 ${Object.keys(subs).length>1?`<div class="sec">Subcategories</div>${Object.entries(subs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{const s=sub(c,k);return `<div class="crow"><div class="tile sm round" style="background:${s?subColor(c,s):c.color}">${ic(s?s.icon:c.icon)}</div><div class="grow"><div class="row"><div class="grow" style="font-size:calc(16px*var(--fs))">${s?esc(s.name):'(no subcategory)'}</div><div style="font-size:calc(16px*var(--fs))">${fmt(v)}</div></div><div class="bar" style="height:7px"><i style="width:${total?(v/total*100).toFixed(1):0}%;background:${s?subColor(c,s):c.color}"></i></div></div></div>`;}).join('')}`:''}
 <div class="sec">Transactions</div>${txList(list)||'<div class="empty">Nothing here</div>'}`;});

/* ---------- ANALYTICS ---------- */
function anaBuckets(){const g=ui.anaGran;const r=monthRange(ui.anaOff);const B=[];
 if(g==='D'){for(let d=r.start;d<=r.end;d=addDays(d,1))B.push({start:d,end:d,label:fmtDateShort(d)});}
 else if(g==='W'){let s=r.start;while(s<=r.end){const e=addDays(weekStartOf(s),6);B.push({start:s,end:e<r.end?e:r.end,label:fmtDateShort(s)});s=addDays(e,1);}}
 else{for(let i=11;i>=0;i--){const m=monthRange(ui.anaOff-i);B.push({start:m.start,end:m.end,label:MON3[m.m]});}}
 return B.map(b=>Object.assign(b,flow(b.start,b.end)));}
function renderAna(){const r=monthRange(ui.anaOff);const B=anaBuckets();const f=flow(r.start,r.end);const prev=monthRange(ui.anaOff-1);const pf=flow(prev.start,prev.end);const t=today();const days=r.end<t?dim(r.y,r.m):Math.max(1,diffDays(r.start,t)+1);
 const ser=[];if(ui.anaSeries.income)ser.push({values:B.map(b=>b.income),color:'#34c77b'});if(ui.anaSeries.expense)ser.push({values:B.map(b=>b.expense),color:'#ec5f4f'});if(ui.anaSeries.total)ser.push({values:B.map(b=>b.net),color:'#4d87f5',neg:true});
 const n=B.length;const labels=ui.anaGran==='D'?[0,9,19,n-1].filter(i=>i<n).map(i=>({i,text:B[i].label,anchor:i===0?'start':i===n-1?'end':'middle'})):B.map((b,i)=>({i,text:b.label,anchor:i===0?'start':i===n-1?'end':'middle'})).filter((x,i)=>ui.anaGran==='W'||i%2===0||i===n-1);
 let h=`<div class="title"><span>Analytics</span></div>`+mnav(r.label,'A.anaOff(-1)','A.anaOff(1)',`<button class="ibtn muted" onclick="A.anaFilterMenu(event)">${ic('filter')}</button>`);
 h+=`<div class="row" style="gap:8px;padding:2px 0 8px"><div class="seg sm grow" style="padding:3px">${[['income','Income'],['expense','Expenses'],['total','Total']].map(([k,l])=>`<button class="${ui.anaSeries[k]?'on':''}" onclick="A.anaToggle('${k}')">${l}</button>`).join('')}</div><button class="ibtn" onclick="A.anaGran()" style="font-size:calc(16px*var(--fs));font-weight:600;gap:4px">${ic('chart')}${ui.anaGran}</button></div>`;
 h+=lineChart({series:ser,labels,h:230,padL:70});
 h+=`<div class="card" style="margin-top:12px"><div class="chead"><div class="t"><h2>Cash flow</h2><div class="sub">${r.label}</div></div></div>${cashflowRows(f)}</div>`;
 h+=`<div class="card"><div class="chead"><div class="t"><h2>Average</h2><div class="sub">${r.label}</div></div></div>
 ${[['Day',1],['Week',7],['Month',days]].map(([l,k])=>`<div class="kv"><span>${l}</span><span><span class="pos">${fmt(f.income/days*k)}</span> &nbsp; <span class="neg">${fmt(f.expense/days*k)}</span></span></div>`).join('')}</div>`;
 const pct=(a,b)=>b?Math.round((a-b)/b*100):(a?100:0);
 h+=`<div class="card"><div class="chead"><div class="t"><h2>Compare</h2><div class="sub">vs. ${prev.label}</div></div></div>
 <div class="kv"><span>Cash flow</span><span><span class="pos">${fmt(pf.income)}</span> &nbsp; <span class="neg">${fmt(pf.expense)}</span></span></div>
 <div class="kv"><span>Amount</span><span><span class="pos">${fmt(f.income-pf.income,{sign:true})}</span> &nbsp; <span class="neg">${fmt(f.expense-pf.expense,{sign:true})}</span></span></div>
 <div class="kv"><span>Percent</span><span><span class="pos">${pct(f.income,pf.income)>0?'+':''}${pct(f.income,pf.income)}%</span> &nbsp; <span class="neg">${pct(f.expense,pf.expense)>0?'+':''}${pct(f.expense,pf.expense)}%</span></span></div></div>`;
 const er=catsOf('expense').map(c=>({c,v:flow(r.start,r.end,{catIds:[c.id]}).expense})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
 if(er.length){h+=`<div class="card"><div class="chead"><div class="t"><h2>Top expenses</h2><div class="sub">${r.label}</div></div></div>${er.slice(0,6).map(x=>`<div class="row" style="padding:7px 0;cursor:pointer" onclick="A.catDetail('${x.c.id}',${ui.anaOff})">${tile(x.c.icon,x.c.color,'sm round')}<div class="grow ell" style="font-size:calc(16px*var(--fs))">${esc(x.c.name)}</div><div class="neg" style="font-size:calc(16px*var(--fs))">${fmt(x.v)}</div><div class="small" style="width:40px;text-align:right">${f.expense?Math.round(x.v/f.expense*100):0}%</div></div>`).join('')}</div>`;}
 return h;}

/* ---------- TRANSACTIONS ---------- */
function txRow(t){const a=acc(t.accountId),b=acc(t.toAccountId);let h='';
 if(t.type==='transfer'){h=`<div class="trow" onclick="A.editTx('${t.id}')"><div class="tile round" style="background:#2c2d33">${ic('transfer')}</div><div class="grow"><div class="t2">${a?accLabel(a):'?'}</div><div class="t2">${b?accLabel(b):'?'}</div>${t.note?`<div class="t3 ell">${esc(t.note)}</div>`:''}</div><div><div class="am">${fmt(t.amount)}</div><div class="tm">${fmtTime(t.time)}</div></div></div>`;}
 else{const c=cat(t.categoryId);const s=sub(c,t.subId);h=`<div class="trow" onclick="A.editTx('${t.id}')">${c?catIcon(c,s):tile('tag','#555')}<div class="grow"><div class="t1 ell">${c?esc(c.name):'Uncategorised'}${s?' • '+esc(s.name):''}</div><div class="t2">${a?accLabel(a):'?'}</div>${t.note?`<div class="t3 ell">${esc(t.note)}</div>`:''}</div><div><div class="am ${t.type==='income'?'pos':'neg'}">${fmt(t.amount)}</div><div class="tm">${fmtTime(t.time)}</div></div></div>`;}
 return h;}
function txList(list,accId){const groups={};list.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t);});return Object.keys(groups).sort().reverse().map(d=>{const g=groups[d];const dt=fromISO(d);let right;
 if(accId){const bal=accBalance(accId,d);right=`<div class="right"><div class="small">Balance</div><div class="${bal<0?'neg':''}" style="font-size:calc(16px*var(--fs))">${fmt(bal)}</div></div>`;}
 else{const net=g.reduce((s,t)=>s+(t.type==='income'?t.amount:t.type==='expense'?-t.amount:0),0);right=`<div class="row ${cls(net)}" style="gap:6px;font-size:calc(15px*var(--fs))">${ic('sum')}${fmt(net,{sign:false})}</div>`;}
 return `<div class="day"><div class="dn">${dt.getDate()}</div><div class="grow"><div class="dw">${DAYS[dt.getDay()]}</div><div class="dm">${MONTHS[dt.getMonth()]} ${dt.getFullYear()}</div></div>${right}</div>${g.map(txRow).join('')}`;}).join('');}
function filteredTx(){const F=ui.txFilter;let list=S.transactions;const q=ui.txSearch.trim().toLowerCase();const r=monthRange(ui.txOff);
 if(q){list=list.filter(t=>{const c=cat(t.categoryId),s=sub(c,t.subId),a=acc(t.accountId),b=acc(t.toAccountId);return [t.note,c&&c.name,s&&s.name,a&&a.name,b&&b.name,String(t.amount)].some(x=>x&&String(x).toLowerCase().includes(q));});}
 else list=list.filter(t=>t.date>=r.start&&t.date<=r.end);
 if(F.types.length)list=list.filter(t=>F.types.includes(t.type));
 if(F.accounts.length)list=list.filter(t=>F.accounts.includes(t.accountId)||F.accounts.includes(t.toAccountId));
 if(F.categories.length)list=list.filter(t=>F.categories.includes(t.categoryId));
 if(ui.txDay)list=list.filter(t=>t.date===ui.txDay);
 return list;}
function renderTx(){const r=monthRange(ui.txOff);const list=filteredTx();const F=ui.txFilter;const active=F.types.length+F.accounts.length+F.categories.length;const oneAcc=F.accounts.length===1?F.accounts[0]:null;let inc=0,exp=0;list.forEach(t=>{if(t.type==='income')inc+=t.amount;else if(t.type==='expense')exp+=t.amount;});
 let h=`<div class="search">${ic('search')}<input id="txq" placeholder="Search" value="${esc(ui.txSearch)}" oninput="A.txSearch(this.value)"><button class="ibtn muted ${ui.txCal?'':''}" style="color:${ui.txCal?'#fff':''}" onclick="A.txCal()">${ic('grid')}</button><button class="ibtn muted" onclick="A.recurring()">${ic('calRepeat')}</button></div>`;
 if(!ui.txSearch)h+=mnav(r.label,'A.txOff(-1)','A.txOff(1)',`<button class="ibtn ${active?'':'muted'}" style="${active?'color:#4d87f5':''}" onclick="A.txFilter()">${ic('filter')}</button>`);else h+=`<div class="hint">Showing results across all dates</div>`;
 if(oneAcc){const a=acc(oneAcc);const endD=r.end<today()?r.end:today();const bal=accBalance(oneAcc,endD);h+=`<div class="tots"><span class="row" style="gap:6px">${a?accLabel(a):''}</span><span class="${bal<0?'neg':''}">Balance ${fmt(bal)}</span></div>`;}
 else h+=`<div class="tots"><span class="pos">${fmt(inc)}</span><span class="neg">${fmt(exp)}</span><span class="${cls(inc-exp)} row" style="gap:4px">${ic('sum')}${fmt(inc-exp,{sign:true})}</span></div>`;
 if(ui.txCal&&!ui.txSearch){h+=`<div class="cal">`;const ws=S.settings.weekStart||1;for(let i=0;i<7;i++)h+=`<div class="h">${DAY3[(ws+i)%7]}</div>`;const first=fromISO(r.start);const lead=(first.getDay()-ws+7)%7;for(let i=0;i<lead;i++)h+=`<div></div>`;const nd=dim(r.y,r.m);const byDay={};S.transactions.forEach(t=>{if(t.date>=r.start&&t.date<=r.end&&t.type!=='transfer')byDay[t.date]=(byDay[t.date]||0)+(t.type==='income'?t.amount:-t.amount);});
  for(let d=1;d<=nd;d++){const ds=`${r.y}-${pad(r.m+1)}-${pad(d)}`;const v=byDay[ds];h+=`<div class="d ${ui.txDay===ds?'on':''} ${ds>today()?'off':''}" onclick="A.txDay('${ds}')"><div>${d}</div>${v?`<div class="v ${cls(v)}">${fmtK(v)}</div>`:''}</div>`;}h+='</div>';}
 if(ui.txDay)h+=`<div class="hint">${fmtDate(ui.txDay)} · <span class="link" onclick="A.txDay(null)">clear</span></div>`;
 h+=txList(list,oneAcc)||`<div class="empty">No transactions${ui.txSearch?' found':' in '+r.label}.<br><br>Tap <b>+</b> to add one.</div>`;
 return h;}

 :['expense','income'].map(tp=>`<div class="sec">${tp==='expense'?'Expense':'Income'}</div>`+catsOf(tp).map(c=>`<div class="li tap" onclick="A.fCat('${c.id}')">${tile(c.icon,c.color,'round')}<div class="grow nm">${esc(c.name)}</div><span class="cb ${F.categories.includes(c.id)?'on':''}">${F.categories.includes(c.id)?ic('check'):''}</span></div>`).join('')).join('')}
 <div class="btnrow"><button class="btn" onclick="closeSheet()">${ic('check')} Apply</button></div>`;});};

/* ===================== TRANSACTION EDITOR ===================== */
function defaultAccount(){const l=liveAccounts();return (l.find(a=>a.fav)||l[0]||{}).id;}
function newDraft(o){o=o||{};const type=o.type||S.settings.defaultTxType||'expense';const c=catsOf(type)[0];return Object.assign({id:null,type,date:today(),time:nowTime(),accountId:defaultAccount(),toAccountId:null,categoryId:c?c.id:null,subId:null,note:'',expr:'',repeat:'never'},o);}
A.newTx=o=>{ui.tx=newDraft(o);openTxSheet();};
A.editTx=id=>{const t=S.transactions.find(x=>x.id===id);if(!t)return;ui.tx=Object.assign(newDraft({type:t.type}),t,{expr:String(t.amount),repeat:'never'});openTxSheet();};
function openTxSheet(){ui.txBodyH=null;openSheet('tx',renderTxSheet,{live:false,cls:'tx'});}
function renderTxSheet(){const d=ui.tx;const accs=liveAccounts();const cats=catsOf(d.type);const c=cat(d.categoryId);const subs=c?(c.subs||[]):[];const isEdit=!!d.id;
 const accChip=(a,sel,fn,lab)=>`<button class="chip ${sel?'on':''}" style="${sel?'background:'+a.color:''}" onclick="${fn}('${a.id}')">${tile(a.icon,a.color,'sm')}<div><div class="n">${esc(a.name)}</div><div class="b">${sel&&lab?lab+' · ':''}${fmt(accBalance(a.id))}</div></div></button>`;
 let h=`<div class="hdr"><button class="ibtn" onclick="closeSheet()">${ic('close')}</button><h1 class="c">${isEdit?'Edit transaction':'New transaction'}</h1>${isEdit?`<button class="ibtn" onclick="A.deleteTx()">${ic('trash')}</button>`:'<span style="width:42px"></span>'}</div><div class="txbody">`;
 h+=`<div class="seg">${[['income','Income'],['expense','Expense'],['transfer','Transfer']].map(([k,l])=>`<button class="${d.type===k?'on':''}" onclick="A.txType('${k}')">${l}</button>`).join('')}</div>`;
 h+=`<div class="row" style="padding:14px 0 6px"><button class="ibtn" onclick="A.txDate(-1)">${ic('chevL')}</button><label class="row grow" style="justify-content:center;gap:10px;font-size:calc(16px*var(--fs));position:relative;white-space:nowrap">${ic('calendar')}${fmtDate(d.date)}<input type="date" value="${d.date}" onchange="A.txSetDate(this.value)" style="position:absolute;inset:0;opacity:0;width:100%"></label><label class="row grow" style="justify-content:center;gap:10px;font-size:calc(16px*var(--fs));position:relative;white-space:nowrap">${ic('clock')}${fmtTime(d.time)}<input type="time" value="${d.time}" onchange="A.txSetTime(this.value)" style="position:absolute;inset:0;opacity:0;width:100%"></label><button class="ibtn" onclick="A.txDate(1)">${ic('chevR')}</button></div>`;
 h+=`<div class="chips">${accs.map(a=>accChip(a,a.id===d.accountId,'A.txAcc',d.type==='transfer'?'From':'')).join('')}</div>`;
 h+=`<div id="amt" class="amt ${d.expr?'':'dim'}">${amtDisplay()}</div><div class="amtline"></div>`;
 h+=`<input class="note" placeholder="Add note" value="${esc(d.note)}" oninput="ui.tx.note=this.value">`;
 if(d.type==='transfer'){h+=`<div class="chips"><span style="flex:none;align-self:center;color:var(--muted);font-size:calc(15px*var(--fs));padding:0 4px 0 2px">To</span>${accs.filter(a=>a.id!==d.accountId).map(a=>`<button class="cchip ${a.id===d.toAccountId?'on':''}" style="${a.id===d.toAccountId?'color:'+a.color:''}" onclick="A.txToAcc('${a.id}')">${tile(a.icon,a.color)}<span style="color:#ececef">${esc(a.name)}</span></button>`).join('')}</div><div class="subchips"><button disabled style="opacity:.45">${d.toAccountId?'Transfer to '+esc((acc(d.toAccountId)||{}).name||''):'Choose the account to transfer to'}</button></div>`;}
 else {h+=`<div class="chips">${cats.map(x=>`<button class="cchip ${x.id===d.categoryId?'on':''}" style="${x.id===d.categoryId?'color:'+x.color:''}" onclick="A.txCat('${x.id}')">${tile(x.icon,x.color)}<span style="color:#ececef">${esc(x.name)}</span></button>`).join('')}<button class="cchip" onclick="A.editCat(null,'${d.type}')">${tile('plus','#44454c')}<span style="color:var(--muted)">New</span></button></div>`;
  if(!subs.length)h+=`<div class="subchips"><button disabled style="opacity:.45">No subcategories</button></div>`;
  else h+=`<div class="subchips"><button class="${!d.subId?'on':''}" onclick="A.txSub(null)">None</button>${subs.map(s=>`<button class="${s.id===d.subId?'on':''}" onclick="A.txSub('${s.id}')"><span class="tile xs round" style="background:${s.color||c.color}">${ic(s.icon)}</span>${esc(s.name)}</button>`).join('')}</div>`;}
 if(!isEdit)h+=`<div class="row" style="justify-content:center;padding:2px 0 8px"><button class="btn sm ghost" onclick="A.txRepeatMenu(event)">${ic('repeat')} Repeat: ${d.repeat==='never'?'Never':d.repeat[0].toUpperCase()+d.repeat.slice(1)}</button></div>`;
 h+=`</div><div class="keypad">
 <button class="op" onclick="A.key('÷')">÷</button><button onclick="A.key('7')">7</button><button onclick="A.key('8')">8</button><button onclick="A.key('9')">9</button><button class="op" onclick="A.key('bs')">${ic('backspace')}</button>
 <button class="op" onclick="A.key('×')">×</button><button onclick="A.key('4')">4</button><button onclick="A.key('5')">5</button><button onclick="A.key('6')">6</button><button class="op" onclick="A.templates()">${ic('copy')}</button>
 <button class="op" onclick="A.key('-')">−</button><button onclick="A.key('1')">1</button><button onclick="A.key('2')">2</button><button onclick="A.key('3')">3</button><button class="ok" onclick="A.key('ok')">${ic('check')}</button>
 <button class="op" onclick="A.key('+')">+</button><button class="op" onclick="A.key('pm')">±</button><button onclick="A.key('0')">0</button><button onclick="A.key('.')">.</button></div>`;
 return h;}
function amtDisplay(){const e=ui.tx.expr;return S.settings.currency+(e?e.replace(/\*/g,'×').replace(/\//g,'÷'):'0');}
function evalExpr(s){s=s.replace(/×/g,'*').replace(/÷/g,'/').replace(/[^0-9.+\-*/]/g,'').replace(/[+\-*/]+$/,'');if(!s)return 0;if(!/^[0-9.+\-*/]+$/.test(s))return NaN;try{return Function('"use strict";return ('+s+')')();}catch(e){return NaN;}}
A.key=k=>{const d=ui.tx;let e=d.expr;const ops='+-*/';
 if(k==='bs')e=e.slice(0,-1);
 else if(k==='ok'){if(/[+\-*/]/.test(e.slice(1))){const v=evalExpr(e);if(isNaN(v)){toast('Bad expression');return;}d.expr=String(num(Math.abs(v)));updateAmt();return;}saveTx();return;}
 else if(k==='pm'){const m=e.match(/(-?\d*\.?\d*)$/);const last=m?m[1]:'';const head=e.slice(0,e.length-last.length);e=head+(last.startsWith('-')?last.slice(1):'-'+last);}
 else if(k==='.'){const last=e.split(/[+\-*/]/).pop();if(!last.includes('.'))e+=(last===''?'0':'')+'.';}
 else if('÷×-+'.includes(k)){const op={'÷':'/','×':'*','-':'-','+':'+'}[k];if(!e){if(op==='-')e='-';}else if(ops.includes(e.slice(-1)))e=e.slice(0,-1)+op;else e+=op;}
 else{const last=e.split(/[+\-*/]/).pop();if(last==='0')e=e.slice(0,-1);if(last.replace('.','').length<10)e+=k;}
 d.expr=e;updateAmt();};
function updateAmt(){const el=document.getElementById('amt');if(el){el.textContent=amtDisplay();el.className='amt '+(ui.tx.expr?'':'dim');}}
A.txCycleAcc=dir=>{const accs=liveAccounts();if(!accs.length)return;const d=ui.tx;let i=accs.findIndex(a=>a.id===d.accountId);i=(i+dir+accs.length)%accs.length;if(d.type==='transfer'&&accs[i].id===d.toAccountId)i=(i+dir+accs.length)%accs.length;d.accountId=accs[i].id;rerenderTop();const el=document.getElementById('sheet-'+(sheets.length-1));if(el)scrollChipIntoView(el);if(navigator.vibrate)try{navigator.vibrate(8);}catch(e){}};

function saveTx(){const d=ui.tx;const v=evalExpr(d.expr);const amount=num(Math.abs(v));if(!amount||isNaN(amount)){toast('Enter an amount');return;}
 if(!d.accountId){toast('Choose an account');return;}
 if(d.type==='transfer'&&(!d.toAccountId||d.toAccountId===d.accountId)){toast('Choose the destination account');return;}
 if(d.type!=='transfer'&&!d.categoryId){toast('Choose a category');return;}
 const t={id:d.id||uid(),type:d.type,amount,date:d.date,time:d.time,accountId:d.accountId,toAccountId:d.type==='transfer'?d.toAccountId:null,categoryId:d.type==='transfer'?null:d.categoryId,subId:d.type==='transfer'?null:(d.subId||null),note:(d.note||'').trim()};
 if(d.id){const i=S.transactions.findIndex(x=>x.id===d.id);if(i>=0)S.transactions[i]=Object.assign({},S.transactions[i],t);}else S.transactions.push(t);
 if(!d.id&&d.repeat&&d.repeat!=='never'){S.recurring.push({id:uid(),freq:d.repeat,active:true,nextDate:advance(d.date,d.repeat),template:Object.assign({},t,{id:undefined})});}
 sortTx();closeSheet();setTimeout(()=>{refresh();toast(d.id?'Updated':'Saved');},30);}
A.deleteTx=()=>confirmDlg('Delete this transaction?',()=>{S.transactions=S.transactions.filter(x=>x.id!==ui.tx.id);closeSheet();setTimeout(()=>{refresh();toast('Deleted');},30);});
A.templates=()=>openSheet('templates',()=>{const seen={};const list=[];for(const t of S.transactions){const k=[t.type,t.categoryId,t.subId,t.accountId,t.toAccountId,t.note].join('|');if(seen[k])continue;seen[k]=1;list.push(t);if(list.length>=40)break;}
 return `<div class="hdr"><button class="ibtn" onclick="closeSheet()">${ic('close')}</button><h1>Recent entries</h1></div><div class="hint">Tap to fill in the same details again.</div>${list.map(t=>{const c=cat(t.categoryId),s=sub(c,t.subId),a=acc(t.accountId),b=acc(t.toAccountId);return `<div class="trow" onclick="A.useTemplate('${t.id}')">${t.type==='transfer'?`<div class="tile round" style="background:#2c2d33">${ic('transfer')}</div>`:c?catIcon(c,s):tile('tag','#555')}<div class="grow"><div class="t1 ell">${t.type==='transfer'?(a?esc(a.name):'?')+' → '+(b?esc(b.name):'?'):(c?esc(c.name):'?')+(s?' • '+esc(s.name):'')}</div><div class="t2">${t.type!=='transfer'&&a?accLabel(a):''}</div>${t.note?`<div class="t3 ell">${esc(t.note)}</div>`:''}</div><div class="am">${fmt(t.amount)}</div></div>`;}).join('')||'<div class="empty">No transactions yet</div>'}`;});
A.useTemplate=id=>{const t=S.transactions.find(x=>x.id===id);if(!t)return;Object.assign(ui.tx,{type:t.type,accountId:t.accountId,toAccountId:t.toAccountId,categoryId:t.categoryId,subId:t.subId,note:t.note,expr:String(t.amount)});closeSheet();setTimeout(rerenderTop,30);};
