A.delBudget=id=>confirmDlg('Delete this budget?',()=>{S.budgets=S.budgets.filter(b=>b.id!==id);closeSheet();setTimeout(()=>{refresh();toast('Deleted');},30);});

/* ===================== RECURRING ===================== */
A.recurring=()=>openSheet('recurring',()=>`<div class="hdr"><button class="ibtn" onclick="closeSheet()">${ic('close')}</button><h1>Scheduled</h1></div><div class="hint">Repeating transactions are added automatically when their date arrives. Create one from the “Repeat” option in a new transaction.</div>
 ${S.recurring.map(r=>{const t=r.template;const c=cat(t.categoryId),a=acc(t.accountId),b=acc(t.toAccountId);return `<div class="li">${t.type==='transfer'?`<div class="tile round" style="background:#2c2d33">${ic('transfer')}</div>`:c?tile(c.icon,c.color):tile('tag','#555')}<div class="grow"><div class="nm">${t.type==='transfer'?(a?esc(a.name):'?')+' → '+(b?esc(b.name):'?'):(c?esc(c.name):'?')}${t.note?' · '+esc(t.note):''}</div><div class="sb">${fmt(t.amount)} · ${r.freq} · next ${fmtDate(r.nextDate)}${r.active?'':' · paused'}</div></div><span class="sw ${r.active?'on':''}" onclick="A.recToggle('${r.id}')"></span><button class="ibtn muted" onclick="A.recDel('${r.id}')">${ic('trash')}</button></div>`;}).join('')||'<div class="empty">Nothing scheduled</div>'}`);
A.recToggle=id=>{const r=S.recurring.find(x=>x.id===id);r.active=!r.active;refresh();};
A.recDel=id=>confirmDlg('Remove this schedule? Already-added transactions stay.',()=>{S.recurring=S.recurring.filter(x=>x.id!==id);refresh();});

/* ===================== SETTINGS / BACKUP ===================== */
A.settings=()=>openSheet('settings',()=>{const st=S.settings;
 const sw=(on,fn)=>`<span class="sw ${on?'on':''}" onclick="${fn}"></span>`;
 const seg=(opts,cur,fn)=>`<div class="seg sm">${opts.map(([k,l])=>`<button class="${cur===k?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
 const names={accounts:'Accounts',credit:'Credit cards',categories:'Categories',cashflow:'Cash flow',budgets:'Budgets'};
 return `<div class="hdr"><button class="ibtn" onclick="closeSheet()">${ic('close')}</button><h1>Settings</h1></div>
 <div class="sec">Appearance</div>
 <div class="setrow"><div class="grow"><div class="nm">Display size</div><input class="slider" type="range" min="70" max="125" step="5" value="${Math.round((st.uiZoom||1)*100)}" oninput="A.set('uiZoom',this.value/100,true);document.getElementById('zv').textContent=this.value+'%'"></div><div class="val" id="zv">${Math.round((st.uiZoom||1)*100)}%</div></div>
 <div class="setrow"><div class="grow"><div class="nm">Text size</div><input class="slider" type="range" min="80" max="125" step="5" value="${Math.round((st.fontScale||1)*100)}" oninput="A.set('fontScale',this.value/100,true);document.getElementById('fv').textContent=this.value+'%'"></div><div class="val" id="fv">${Math.round((st.fontScale||1)*100)}%</div></div>
 <div class="hint">Tip: if the app looks bigger than other apps on your phone, lower Display size to 85–90%.</div>
 <div class="setrow"><div class="grow nm">Theme</div>${seg([['dark','Dark'],['black','Black (OLED)']],st.theme,'A.setTheme')}</div>
 <div class="setrow"><div class="nm">Accent colour</div></div><div class="accents">${ACCENTS.map(c=>`<span class="${st.accent===c?'on':''}" style="background:${c}" onclick="A.set('accent','${c}')"></span>`).join('')}</div>
 <div class="sec">Home screen</div>
 <div class="hint">Switch cards on/off and use the arrows to change their order.</div>
 ${(st.homeOrder||[]).map((k,i)=>`<div class="setrow"><div class="row" style="gap:0"><button class="ibtn muted" style="padding:4px" onclick="A.homeMove('${k}',-1)">${ic('arrowUp')}</button><button class="ibtn muted" style="padding:4px" onclick="A.homeMove('${k}',1)">${ic('arrowDown')}</button></div><div class="grow nm">${names[k]||k}</div>${sw(st.homeCards[k],`A.toggleCard('${k}')`)}</div>`).join('')}
 <div class="sec">Behaviour</div>
 <div class="setrow"><div class="grow nm">Open app on</div>${seg([['home','Home'],['tx','Transactions']],st.startTab,'A.setStart')}</div>
 <div class="setrow"><div class="grow nm">New transaction defaults to</div>${seg([['expense','Expense'],['income','Income']],st.defaultTxType,'A.setDefType')}</div>
 <div class="setrow"><div class="grow"><div class="nm">Hide balances</div><div class="small">Shows •••• instead of amounts (tap the eye on Home)</div></div>${sw(st.hideBalances,"A.toggleHide();rerenderTop()")}</div>
 <div class="setrow"><div class="grow"><div class="nm">Backup reminder</div><div class="small">Show a reminder on Home when no backup for this many days (0 = never)</div></div><div class="field" style="margin:0;width:80px;padding:6px 12px"><input type="number" min="0" value="${st.backupDays}" oninput="A.set('backupDays',+this.value||0)"></div></div>
 <div class="sec">Numbers & dates</div>
 <div class="setrow"><div class="grow nm">Currency symbol</div><div class="field" style="margin:0;width:80px;padding:6px 12px"><input value="${esc(st.currency)}" oninput="A.set('currency',this.value||'₹')"></div></div>
 <div class="setrow"><div class="grow nm">Number format</div>${seg([['intl','1,25,000'.replace('1,25,000','125,000')],['indian','1,25,000']],st.numFmt,'A.setNumFmt')}</div>
 <div class="setrow"><div class="grow nm">Decimals</div>${seg([['auto','Only if needed'],['always','Always .00']],st.decimals,'A.setDecimals')}</div>
 <div class="setrow"><div class="grow nm">Week starts on</div>${seg([['1','Monday'],['0','Sunday']],String(st.weekStart),'A.setWeekStart')}</div>
 <div class="sec">Backup & data</div>
 <div class="hint">Your data lives only on this device/browser. Last backup: <b style="color:#fff">${st.lastBackup?fmtDate(st.lastBackup):'never'}</b></div>
 <div class="row" style="gap:10px;padding:6px 0;flex-wrap:wrap"><button class="btn sm" onclick="A.backup()">${ic('cloud')} Backup (JSON)</button><button class="btn sm ghost" onclick="A.shareBackup()">Share backup…</button><button class="btn sm ghost" onclick="document.getElementById('fileRestore').click()">Restore backup</button></div>
 <div class="hint">“Share backup” sends the file to Google Drive, WhatsApp, email etc. — the easiest way to keep a copy off the phone.</div>
 <div class="setrow"><div class="grow"><div class="nm">Automatic daily snapshots</div><div class="small">The app saves a copy of your data inside the browser every day (last 14 days) so you can undo mistakes. It does not survive clearing browser data — still share a backup file regularly.</div></div></div>
 <div class="row" style="gap:10px;padding:0 0 6px;flex-wrap:wrap">${ui.snaps?(ui.snaps.length?ui.snaps.map(k=>`<button class="btn sm ghost" onclick="A.restoreSnap('${k}')">${fmtDate(k)}</button>`).join(''):'<span class="hint">No snapshots yet</span>'):`<button class="btn sm ghost" onclick="A.listSnaps()">Show snapshots</button>`}</div>
 <div class="row" style="gap:10px;padding:6px 0;flex-wrap:wrap"><button class="btn sm ghost" onclick="A.exportCsv()">Export CSV</button><button class="btn sm ghost" onclick="document.getElementById('fileCsv').click()">Import CSV</button><button class="btn sm ghost" onclick="A.pasteRestore()">Restore from pasted text</button></div>
 <div class="hint">Cloud sync: <b style="color:#fff">${cloud.status==='synced'?'on — saved to your Claude account':cloud.status==='error'?'error saving — data kept on this device':'off (data stays on this device)'}</b></div>
 <div class="hint">${S.accounts.length} accounts · ${S.categories.length} categories · ${S.transactions.length} transactions · ${S.budgets.length} budgets</div>
 <div class="row" style="gap:10px;padding:6px 0;flex-wrap:wrap"><button class="btn sm ghost" onclick="A.manageCats()">Manage categories</button><button class="btn sm ghost" onclick="A.accounts()">Manage accounts</button><button class="btn sm ghost" onclick="A.recurring()">Scheduled</button></div>
 <div class="row" style="gap:10px;padding:6px 0"><button class="btn sm danger" onclick="A.resetAll()">Erase everything</button></div>
 <div class="sec">About</div><div class="hint">Paisa · a private, offline money manager. Add this page to your home screen to use it like an app.</div>`;});
A.set=(k,v,light)=>{S.settings[k]=v;persist();S.meta.updated=Date.now();cloudPush();applyTheme();if(!light){render();rerenderTop();}};
A.setTheme=v=>A.set('theme',v);A.setStart=v=>A.set('startTab',v);A.setDefType=v=>A.set('defaultTxType',v);A.setNumFmt=v=>A.set('numFmt',v);A.setDecimals=v=>A.set('decimals',v);A.setWeekStart=v=>A.set('weekStart',+v);
A.toggleCard=k=>{S.settings.homeCards[k]=!S.settings.homeCards[k];refresh();};
A.homeMove=(k,d)=>{const o=S.settings.homeOrder;const i=o.indexOf(k),j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];refresh();};
async function download(name,content,type){if(window.claude&&typeof claude.use==='function'){try{const dl=await claude.use('downloads');if(dl){try{await dl.save({filename:name,data:content});}catch(e){if(!/declin|cancel|abort/i.test(String(e&&e.message)))throw e;}return;}}catch(e){console.warn(e);}
 try{await navigator.clipboard.writeText(content);toast('Download not available here — copied to clipboard instead. Paste it into a note to keep it.');return;}catch(e){toast('Download not available in this view');return;}}
 const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},500);}
/* daily automatic snapshots kept inside the browser (safety net against accidental edits) */
function idb(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej(new Error('no idb'));const r=indexedDB.open('paisa-snapshots',1);r.onupgradeneeded=()=>r.result.createObjectStore('snaps');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function snapOp(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction('snaps',mode);const st=tx.objectStore('snaps');const q=fn(st);tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error);}));}
async function autoSnapshot(){try{if(!S.transactions.length)return;const t=today();const keys=await snapOp('readonly',st=>st.getAllKeys())||[];if(keys.includes(t))return;await snapOp('readwrite',st=>st.put(JSON.stringify(S),t));const all=(await snapOp('readonly',st=>st.getAllKeys())||[]).sort();for(const k of all.slice(0,Math.max(0,all.length-14)))await snapOp('readwrite',st=>st.delete(k));}catch(e){console.warn('snapshot',e);}}
A.listSnaps=async()=>{try{const keys=(await snapOp('readonly',st=>st.getAllKeys())||[]).sort().reverse();ui.snaps=keys;}catch(e){ui.snaps=[];}rerenderTop();};
A.restoreSnap=async k=>{try{const raw=await snapOp('readonly',st=>st.get(k));if(!raw)throw new Error('missing');const d=JSON.parse(raw);confirmDlg(`Restore the automatic backup from ${fmtDate(k)} (${d.transactions.length} transactions)? Current data will be replaced.`,()=>{S=d;S.settings=Object.assign(defaultSettings(),S.settings||{});save();history.go(-sheets.length);setTimeout(()=>{refresh();toast('Restored');},60);});}catch(e){toast('Could not restore: '+e.message);}};
A.shareBackup=async()=>{const name=`paisa-backup-${today()}.json`;const json=JSON.stringify(S,null,1);try{const file=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Paisa backup'});S.settings.lastBackup=today();save();refresh();return;}}catch(e){if(/abort/i.test(String(e)))return;}toast('Sharing not available here — use Backup (JSON) instead');};
A.backup=()=>{S.settings.lastBackup=today();save();download(`paisa-backup-${today()}.json`,JSON.stringify(S,null,1),'application/json');refresh();toast('Backup downloaded');};
A.pasteRestore=()=>openSheet('paste',()=>`<div class="hdr"><button class="ibtn" onclick="closeSheet()">${ic('close')}</button><h1>Restore from text</h1></div><div class="hint">Paste the contents of a Paisa backup (JSON) below.</div><textarea id="pasteBox" style="width:100%;height:50vh;background:var(--card2);color:var(--text);border:0;border-radius:18px;padding:14px;font-size:calc(13px*var(--fs))"></textarea><div class="btnrow"><button class="btn" onclick="A.applyPaste()">Restore</button></div>`,{live:false});
A.applyPaste=()=>{try{const d=JSON.parse(document.getElementById('pasteBox').value);if(!d.accounts||!d.transactions)throw new Error('Not a Paisa backup');S=d;S.settings=Object.assign(defaultSettings(),S.settings||{});S.recurring=S.recurring||[];S.budgets=S.budgets||[];save();history.go(-sheets.length);setTimeout(()=>{refresh();toast('Restored');},60);}catch(e){toast('Restore failed: '+e.message);}};
A.restoreFile=inp=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.accounts||!d.transactions)throw new Error('Not a Paisa backup');confirmDlg(`Replace current data with this backup (${d.transactions.length} transactions)?`,()=>{S=d;S.settings=Object.assign(defaultSettings(),S.settings||{});S.recurring=S.recurring||[];S.budgets=S.budgets||[];save();history.go(-sheets.length);setTimeout(()=>{refresh();toast('Restored');},60);});}catch(e){toast('Restore failed: '+e.message);}inp.value='';};rd.readAsText(f);};
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
A.exportCsv=()=>{const rows=[['Date','Time','Type','Amount','Account','To account','Category','Subcategory','Note']];const list=S.transactions.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));list.forEach(t=>{const c=cat(t.categoryId),s=sub(c,t.subId),a=acc(t.accountId),b=acc(t.toAccountId);rows.push([t.date,t.time,t.type,t.amount,a?a.name:'',b?b.name:'',c?c.name:'',s?s.name:'',t.note]);});download(`paisa-transactions-${today()}.csv`,'﻿'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');toast('CSV downloaded');};
function parseCsv(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=ch;}if(cell||row.length){row.push(cell);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()));}
function parseAnyDate(s){s=(s||'').trim();let m;if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/)))return `${m[3]}-${pad(+m[2])}-${pad(+m[1])}`;const d=new Date(s);return isNaN(d)?null:toISO(d);}
A.importCsvFile=inp=>{const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const rows=parseCsv(rd.result.replace(/^﻿/,''));const head=rows.shift().map(h=>h.trim().toLowerCase());const col=(...names)=>{for(const n of names){const i=head.findIndex(h=>h===n||h.includes(n));if(i>=0)return i;}return -1;};const ci={date:col('date'),time:col('time'),type:col('type'),amount:col('amount'),account:col('account'),to:col('to account','to_account','to'),cat:col('category'),sub:col('subcategory','sub category','sub'),note:col('note','description','memo')};if(ci.date<0||ci.amount<0)throw new Error('Need at least Date and Amount columns');
 let n=0,skipped=0;const findAcc=nm=>{nm=(nm||'').trim();if(!nm)return null;let a=S.accounts.find(x=>x.name.toLowerCase()===nm.toLowerCase());if(!a){a={id:uid(),name:nm,icon:'bank',color:COLORS[S.accounts.length%COLORS.length],opening:0,type:'regular',fav:false,archived:false};S.accounts.push(a);}return a;};
 const findCat=(nm,type)=>{nm=(nm||'').trim()||'Other';let c=S.categories.find(x=>x.name.toLowerCase()===nm.toLowerCase()&&x.type===type);if(!c){c={id:uid(),name:nm,type,icon:'tag',color:COLORS[S.categories.length%COLORS.length],subs:[]};S.categories.push(c);}return c;};
 rows.forEach(r=>{const date=parseAnyDate(r[ci.date]);let amount=parseFloat(String(r[ci.amount]).replace(/[^0-9.\-]/g,''));if(!date||isNaN(amount)||!amount){skipped++;return;}let type=ci.type>=0?String(r[ci.type]).toLowerCase():'';if(/transfer/.test(type))type='transfer';else if(/income|credit|deposit/.test(type))type='income';else if(/expense|debit|withdraw/.test(type))type='expense';else type=amount<0?'expense':'income';amount=Math.abs(amount);
  const a=findAcc(ci.account>=0?r[ci.account]:'')||findAcc('Imported');const t={id:uid(),type,amount:num(amount),date,time:ci.time>=0&&/\d/.test(r[ci.time]||'')?(r[ci.time].match(/\d{1,2}:\d{2}/)||['12:00'])[0].padStart(5,'0'):'12:00',accountId:a.id,toAccountId:null,categoryId:null,subId:null,note:ci.note>=0?(r[ci.note]||'').trim():''};
  if(type==='transfer'){const b=findAcc(ci.to>=0?r[ci.to]:'');if(!b){skipped++;return;}t.toAccountId=b.id;}else{const c=findCat(ci.cat>=0?r[ci.cat]:'',type);t.categoryId=c.id;const sn=ci.sub>=0?(r[ci.sub]||'').trim():'';if(sn){let s=c.subs.find(x=>x.name.toLowerCase()===sn.toLowerCase());if(!s){s={id:uid(),name:sn,icon:'tag'};c.subs.push(s);}t.subId=s.id;}}
  S.transactions.push(t);n++;});
 sortTx();save();history.go(-sheets.length);setTimeout(()=>{refresh();toast(`Imported ${n} transactions${skipped?', skipped '+skipped:''}`);},60);}catch(e){toast('Import failed: '+e.message);}inp.value='';};rd.readAsText(f);};
A.resetAll=()=>confirmDlg('Erase ALL data? This cannot be undone. Make a backup first!',()=>{localStorage.removeItem(LS_KEY);S=seed();S.accounts=[];S.budgets=[];save();history.go(-sheets.length);setTimeout(()=>{refresh();toast('All data erased');},60);});

/* ===================== INIT ===================== */
load();applyTheme();if(!S.meta.dailyBackupSet){S.settings.backupDays=1;S.meta.dailyBackupSet=1;persist();}ui.tab=S.settings.startTab==='tx'?'tx':'home';sortTx();postRecurring();render();cloudInit();autoSnapshot();
if(/[?&]new=1/.test(location.search)||location.hash==='#new'){history.replaceState({n:0},'',location.pathname);setTimeout(()=>A.newTx(),80);}
/* ---- PWA: service worker + update notice ---- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){const t=document.createElement('div');t.className='toast';t.style.cursor='pointer';t.innerHTML='New version ready — tap to update';t.onclick=()=>location.reload();document.body.appendChild(t);}});});}).catch(e=>console.warn('sw',e));});}

</script>
